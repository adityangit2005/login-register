<!DOCTYPE html>
<html>
<head>
	<title>Login Page</title>
	<style>
		body {
			font-family: Arial, sans-serif;
		}
		.container {
			width: 300px;
			margin: 50px auto;
			padding: 20px;
			border: 1px solid #ccc;
			border-radius: 10px;
			box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
		}
		label {
			display: block;
			margin-bottom: 10px;
		}
		input[type="text"], input[type="email"], input[type="tel"] {
			width: 100%;
			height: 40px;
			margin-bottom: 20px;
			padding: 10px;
			border: 1px solid #ccc;
		}
		button[type="submit"] {
			background-color: #4CAF50;
			color: #fff;
			padding: 10px 20px;
			border: none;
			border-radius: 5px;
			cursor: pointer;
		}
		button[type="submit"]:hover {
			background-color: #3e8e41;
		}
	</style>
</head>
<body>
	<div class="container">
		<h2>Login Here</h2>
		<form>
			<label for="fullName">Full Name:</label>
			<input type="text" id="fullName" name="fullName" value="Aditya Tanaji Nikam"><br><br>
			<label for="emailId">E-mail Id:</label>
			<input type="email" id="emailId" name="emailId" value="adityanikam01888@gmail.com"><br><br>
			<label for="mobileNumber">Mobile Number:</label>
			<input type="tel" id="mobileNumber" name="mobileNumber" value="9850949172"><br><br>
			<label for="cityName">City Name:</label>
			<input type="text" id="cityName" name="cityName" value="Shirala"><br><br>
			<label for="pinCode">Pin Code:</label>
			<input type="text" id="pinCode" name="pinCode" value="415408"><br><br>
			<button type="submit">Submit</button>
			<button type="button">Cancel</button>
		</form>
	</div>
</body>
</html>
